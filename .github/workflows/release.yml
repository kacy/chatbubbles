name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: release tag like v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: verify version
        run: |
          version="$(tr -d '\n' < VERSION)"
          tag="${{ steps.meta.outputs.tag }}"
          release_version="${tag#v}"
          test "$version" = "$release_version"

      - name: check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: run tests
        run: go test ./...

      - name: build release archives
        run: |
          release_version="${{ steps.meta.outputs.tag }}"
          sh ./scripts/build-release.sh "${release_version#v}"

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
