name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: run tests
        run: go test ./...

      - name: build daemon
        run: make build

      - name: build cli
        run: make build-cli
